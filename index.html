<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Welcome — Vincent and Cynah wedding invitation." />
    <title>Welcome · Vincent & Cynah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&family=Great+Vibes&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/rosas-welcome.css?v=32" />
  </head>
  <body class="rosas-welcome-page">
    <main class="rosas-editorial-welcome" id="welcome-screen">
      <img
        class="rosas-editorial-welcome__floral"
        id="welcome-envelope-flowers"
        src="images/welcome-flower.jpeg"
        alt=""
        aria-hidden="true"
      />
      <section class="rosas-editorial-welcome__content" aria-labelledby="welcome-title">
        <p class="rosas-editorial-welcome__save-date">Save the Date</p>
        <p class="rosas-editorial-welcome__eyebrow" id="welcome-headline">For the Wedding Ceremony of</p>
        <h1 class="rosas-editorial-welcome__title" id="welcome-title">
          <span id="welcome-couple-p1">Vincent</span>
          <span class="rosas-editorial-welcome__and">and</span>
          <span id="welcome-couple-p2">Cynah</span>
        </h1>
        <div class="rosas-editorial-welcome__details">
          <p id="welcome-date">February 12, 2027</p>
        </div>
        <div class="rosas-editorial-welcome__divider" aria-hidden="true"></div>
        <p class="rosas-editorial-welcome__rsvp" id="welcome-rsvp">
          You are invited!
        </p>
        <a class="rosas-editorial-welcome__button" id="welcome-enter" href="invitation.html">
          Tap to see more details
        </a>
      </section>
      <div class="rosas-editorial-welcome__photo" role="img" aria-label="Vincent and Cynah">
        <div class="rosas-editorial-welcome__monogram" aria-hidden="true">
          <img id="welcome-monogram" src="images/welcome-monogram-transparent.png" alt="" />
        </div>
      </div>
    </main>

    <script src="js/config.js?v=93"></script>
    <script src="js/welcome.js?v=26"></script>
  </body>
</html>
